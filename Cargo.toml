[workspace]
resolver = "3"
members = [
    "globibot-core",
    "globibot-bot",
    #
    "plugins/*",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.5", features = ["macros", "rt-multi-thread"] }
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = "0.7"

reqwest = { version = "0.11", features = ["json"] }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie-private"] }

futures = "0.3"

thiserror = "2.0"
anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = "0.3"

tarpc = { version = "0.37", features = ["serde1", "serde-transport"] }

slotmap = { version = "1.1", features = ["serde"] }

redis = { version = "1.0", features = ["tokio-comp"] }

rand = "0.9"

parking_lot = "0.12"

uuid = { version = "1.19", features = ["v4", "serde", "fast-rng"] }

[profile.dev.package."*"]
opt-level = 3
